<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mijn Bedrijf — Beheerpaneel</title>
  <style>
    :root {
      --brand-primary: #6c5ce7;
      --brand-primary-dark: #4834d4;
      --brand-bg: #0f0f1a;
    }

    /* Achtergrond van het hele scherm (login + laadscherm) */
    html, body {
      background: linear-gradient(135deg, var(--brand-bg) 0%, #1a1a2e 100%) !important;
    }

    /* Top header balk in het CMS */
    .nc-app-header {
      background-color: var(--brand-bg) !important;
      border-bottom: 2px solid var(--brand-primary) !important;
    }

    /* Login knop */
    button, .nc-loginPage-buttonLogin {
      background-color: var(--brand-primary) !important;
      border-radius: 8px !important;
      transition: background-color 0.2s ease !important;
    }
    button:hover, .nc-loginPage-buttonLogin:hover {
      background-color: var(--brand-primary-dark) !important;
    }

    /* Verberg het Decap logo (het roze "D" icoon) volledig */
    .nc-loginPage-logoIcon {
      display: none !important;
    }

    /* Verberg de "Decap CMS" tekst naast het logo, en zet er eigen tekst voor in de plaats */
    .nc-loginPage-title {
      visibility: hidden;
      position: relative;
      height: 60px;
    }
    .nc-loginPage-title::after {
      visibility: visible;
      position: absolute;
      left: 0;
      top: 0;
      content: "ggagsdhg";
      font-weight: 700;
      font-size: 40px;
      color: white;
    }
  </style>
</head>
<body>
  <!-- Eigen logo/naam bovenin, verschijnt zodra CMS geladen is -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Optioneel: eigen preview-stijl voor de content-preview binnen het CMS
    if (window.CMS) {
      window.CMS.registerPreviewStyle(`
        body { font-family: -apple-system, sans-serif; }
      `);
    }
  </script>
</body>
</html>
