<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Mijn Bedrijf — Beheerpaneel</title>
  <style>
    :root {
      --brand-primary: #6c5ce7;
      --brand-primary-dark: #4834d4;
      --brand-bg: #0f0f1a;
    }

    /* Achtergrond van het hele scherm (login + laadscherm) */
    html, body {
      background: linear-gradient(135deg, var(--brand-bg) 0%, #1a1a2e 100%) !important;
    }

    /* Top header balk in het CMS */
    .nc-app-header {
      background-color: var(--brand-bg) !important;
      border-bottom: 2px solid var(--brand-primary) !important;
    }

    /* Login knop */
    button, .nc-loginPage-buttonLogin {
      background-color: var(--brand-primary) !important;
      border-radius: 8px !important;
      transition: background-color 0.2s ease !important;
    }
    button:hover, .nc-loginPage-buttonLogin:hover {
      background-color: var(--brand-primary-dark) !important;
    }

    /* Container waar we straks onze eigen tekst in zetten i.p.v. het logo */
    #custom-logo-replacement {
      display: none;
      font-weight: 700;
      font-size: 40px;
      color: white;
      margin-bottom: 20px;
      text-align: center;
    }
    #custom-logo-replacement.visible {
      display: block;
    }
    /* Verberg elk element dat Decap zelf rendert als logo/svg op de inlogpagina */
    svg[class*="logo" i],
    [class*="logoIcon" i],
    [class*="LogoIcon" i] {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Eigen logo/naam bovenin, verschijnt zodra CMS geladen is -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Optioneel: eigen preview-stijl voor de content-preview binnen het CMS
    if (window.CMS) {
      window.CMS.registerPreviewStyle(`
        body { font-family: -apple-system, sans-serif; }
      `);
    }

    // Vervang het Decap-logo door eigen tekst, zodra het op de pagina verschijnt.
    // We gebruiken een MutationObserver omdat Decap de loginpagina pas na het
    // laden van het script dynamisch rendert (dus een gewone DOM-check bij page
    // load is te vroeg).
    const CUSTOM_TEXT = "ggagsdhg";

    function replaceLogo() {
      // Zoek elk svg-element op de pagina (het logo is altijd een <svg>)
      const svgs = document.querySelectorAll("svg");
      svgs.forEach((svg) => {
        // Skip als we deze al verwerkt hebben
        if (svg.dataset.logoHandled) return;

        // Heuristiek: het Decap-logo staat bovenaan de inlogpagina,
        // meestal binnen de eerste ~150px hoogte van de pagina
        const rect = svg.getBoundingClientRect();
        if (rect.top < 200 && rect.width > 20) {
          svg.style.display = "none";
          svg.dataset.logoHandled = "true";

          // Zet onze eigen tekst ernaast, als die er nog niet staat
          if (!document.getElementById("custom-logo-replacement")) {
            const el = document.createElement("div");
            el.id = "custom-logo-replacement";
            el.className = "visible";
            el.textContent = CUSTOM_TEXT;
            svg.parentElement.insertBefore(el, svg);
          }
        }
      });
    }

    const observer = new MutationObserver(replaceLogo);
    observer.observe(document.body, { childList: true, subtree: true });

    // Ook meteen proberen, voor het geval alles al geladen is
    window.addEventListener("load", replaceLogo);
  </script>
</body>
</html>
